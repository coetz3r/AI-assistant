<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUNA — Processes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/webUI/monitor.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-eyebrow">LUNA</span>
      <span class="brand-title">System Telemetry</span>
    </div>
    <nav class="tabs">
      <a href="/monitor" class="tab-link">Overview</a>
      <a href="/monitor/ai" class="tab-link">AI Activity</a>
      <a href="/monitor/network" class="tab-link">Network</a>
      <a href="/monitor/process" class="tab-link active">Processes</a>
    </nav>
    <div class="conn-status" id="connStatus">
      <span class="conn-dot" id="connDot"></span>
      <span id="connLabel">connecting…</span>
      <span class="conn-time" id="connTime"></span>
    </div>
  </header>

  <main class="grid">

    <!-- PROCESS COUNT HISTORY -->
    <section class="panel panel--wide" id="panel-proc-history">
      <div class="panel-head">
        <span class="panel-label">Running Processes</span>
        <span class="panel-sub" id="procCount">— running</span>
      </div>
      <div class="panel-body panel-body--spark">
        <canvas id="procSpark" width="900" height="70"></canvas>
      </div>
    </section>

  </main>

  <div class="two-col">
    <section class="panel">
      <div class="panel-head">
        <span class="panel-label">Top CPU</span>
      </div>
      <div class="panel-body">
        <table class="data-table">
          <thead>
            <tr><th>PID</th><th>Process</th><th class="num">CPU %</th></tr>
          </thead>
          <tbody id="topCpuBody">
            <tr><td colspan="3" class="empty-note">Waiting for data…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <span class="panel-label">Top Memory</span>
      </div>
      <div class="panel-body">
        <table class="data-table">
          <thead>
            <tr><th>PID</th><th>Process</th><th class="num">Mem %</th></tr>
          </thead>
          <tbody id="topMemBody">
            <tr><td colspan="3" class="empty-note">Waiting for data…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="/static/monitor-common.js"></script>
  <script src="/static/process.js"></script>
</body>
</html>
