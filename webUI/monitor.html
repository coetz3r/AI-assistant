<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUNA — System Telemetry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/webUI/monitor.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-eyebrow">LUNA</span>
      <span class="brand-title">System Telemetry</span>
    </div>
    <nav class="tabs">
      <a href="/monitor" class="tab-link active">Overview</a>
      <a href="/monitor/ai" class="tab-link">AI Activity</a>
      <a href="/monitor/network" class="tab-link">Network</a>
      <a href="/monitor/process" class="tab-link">Processes</a>
    </nav>
    <div class="conn-status" id="connStatus">
      <span class="conn-dot" id="connDot"></span>
      <span id="connLabel">connecting…</span>
      <span class="conn-time" id="connTime"></span>
    </div>
  </header>

  <main class="grid">

    <!-- CPU -->
    <section class="panel" id="panel-cpu">
      <div class="panel-head">
        <span class="panel-label">CPU</span>
        <span class="panel-sub" id="cpuFreq">—</span>
      </div>
      <div class="panel-body panel-body--dial">
        <div class="dial" id="cpuDial">
          <div class="dial-value" id="cpuValue">--<span class="unit">%</span></div>
        </div>
        <div class="cores" id="cpuCores"></div>
      </div>
      <canvas id="cpuSpark" width="280" height="44" style="margin-top:10px;"></canvas>
      <div class="detail-row"><span>Load avg (1/5/15m)</span><span id="cpuLoad">—</span></div>
      <div class="detail-row"><span>Top process</span><span id="cpuTopProc">—</span></div>
    </section>

    <!-- MEMORY -->
    <section class="panel" id="panel-mem">
      <div class="panel-head">
        <span class="panel-label">Memory</span>
        <span class="panel-sub" id="memTotal">—</span>
      </div>
      <div class="panel-body panel-body--dial">
        <div class="dial" id="memDial">
          <div class="dial-value" id="memValue">--<span class="unit">%</span></div>
        </div>
        <div class="bar-stack">
          <div class="bar-row">
            <span class="bar-label">RAM</span>
            <div class="bar-track"><div class="bar-fill" id="ramBarFill"></div></div>
            <span class="bar-num" id="ramBarNum">—</span>
          </div>
          <div class="bar-row">
            <span class="bar-label">Swap</span>
            <div class="bar-track"><div class="bar-fill bar-fill--warn" id="swapBarFill"></div></div>
            <span class="bar-num" id="swapBarNum">—</span>
          </div>
        </div>
      </div>
      <canvas id="memSpark" width="280" height="44" style="margin-top:10px;"></canvas>
      <div class="detail-row"><span>Available</span><span id="memAvailable">—</span></div>
      <div class="detail-row"><span>Top process</span><span id="memTopProc">—</span></div>
    </section>

    <!-- GPU -->
    <section class="panel" id="panel-gpu">
      <div class="panel-head">
        <span class="panel-label">GPU</span>
        <span class="panel-sub" id="gpuTemp">—</span>
      </div>
      <div class="panel-body panel-body--dial" id="gpuBody">
        <div class="dial" id="gpuDial">
          <div class="dial-value" id="gpuValue">--<span class="unit">%</span></div>
        </div>
      </div>
      <canvas id="gpuSpark" width="280" height="44" style="margin-top:10px;"></canvas>
      <div class="panel-foot panel-foot--note" id="gpuNote"></div>
    </section>

  </main>

  <div class="chip-strip">
    <a href="/monitor/ai" class="chip-link">
      <div>
        <div class="chip-label">AI Activity</div>
        <div class="chip-value" id="chipAi">—</div>
      </div>
      <span class="chip-arrow">→</span>
    </a>
    <a href="/monitor/network" class="chip-link">
      <div>
        <div class="chip-label">Network</div>
        <div class="chip-value" id="chipNet">—</div>
      </div>
      <span class="chip-arrow">→</span>
    </a>
    <a href="/monitor/process" class="chip-link">
      <div>
        <div class="chip-label">Processes</div>
        <div class="chip-value" id="chipProc">—</div>
      </div>
      <span class="chip-arrow">→</span>
    </a>
  </div>

  <script src="/webUI/monitor-common.js"></script>
  <script src="/webUI/monitor.js"></script>
</body>
</html>
