<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Assistant</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --panel-bg: rgba(18, 26, 43, 0.75);
      --border-color: rgba(0, 229, 255, 0.2);
      --accent-cyan: #00e5ff;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation */
    header {
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      background: rgba(11, 15, 25, 0.9);
      backdrop-filter: blur(10px);
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--accent-cyan);
      background: rgba(0, 229, 255, 0.1);
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-cyan);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-cyan);
    }

    /* Main Container */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 1.5rem;
      padding: 1.5rem;
      height: calc(100vh - 65px);
    }

    /* Video Viewport */
    .video-container {
      position: relative;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    /* The Avatar Feed */
    .avatar-feed {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* User Self-Preview Overlay */
    .user-preview {
      position: absolute;
      bottom: 5rem;
      right: 1.5rem;
      width: 160px;
      aspect-ratio: 16/9;
      background: #1e293b;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid var(--border-color);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }

    .user-preview video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Controls Overlay */
    .controls-bar {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1rem;
      background: rgba(11, 15, 25, 0.85);
      padding: 0.75rem 1.25rem;
      border-radius: 40px;
      border: 1px solid var(--border-color);
      backdrop-filter: blur(10px);
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .ctrl-btn:hover {
      background: rgba(0, 229, 255, 0.2);
      color: var(--accent-cyan);
    }

    .ctrl-btn.active {
      background: #ef4444;
      color: #fff;
    }

    /* Side Panel */
    .side-panel {
      background: var(--panel-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(10px);
      overflow: hidden;
    }

    .transcript-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .transcript-body {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .msg {
      max-width: 85%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .msg.ai {
      align-self: flex-start;
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid rgba(0, 229, 255, 0.2);
    }

    .msg.user {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
    }

    /* Responsive adjustment */
    @media (max-width: 850px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 250px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">LUNA AI</div>
    <div class="status-badge">
      <span class="status-dot"></span> Streaming Connected
    </div>
  </header>

  <main>
    <!-- AI Stream Viewport -->
    <div class="video-container">
      <!-- AI Avatar Stream Feed -->
      <img src="watermarked_img_8122240971740277079.jpg" alt="AI Avatar Stream" class="avatar-feed">

      <!-- Self Camera Preview -->
      <div class="user-preview">
        <video id="user-webcam" autoplay muted playsinline></video>
      </div>

      <!-- Call Controls -->
      <div class="controls-bar">
        <button class="ctrl-btn" id="toggle-mic" title="Toggle Mic">🎤</button>
        <button class="ctrl-btn" id="toggle-cam" title="Toggle Camera">📹</button>
        <button class="ctrl-btn active" title="End Session">📞</button>
      </div>
    </div>

    <!-- Live Transcript & Sidebar -->
    <div class="side-panel">
      <div class="transcript-header">Real-time Transcript</div>
      <div class="transcript-body" id="transcript">
        <div class="msg ai">Hello! I'm online and ready. How can I help you today?</div>
        <div class="msg user">I need to check the setup for our repo push.</div>
        <div class="msg ai">Everything looks fully synced on main. Let me know what we should build next!</div>
      </div>
    </div>
  </main>

  <script>
    // Enable local user webcam preview
    const userVideo = document.getElementById('user-webcam');
    
    async function initWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        userVideo.srcObject = stream;
      } catch (err) {
        console.warn('Webcam access declined or unavailable:', err);
      }
    }

    initWebcam();
  </script>
</body>
</html>
