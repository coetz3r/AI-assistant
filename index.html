<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice AI Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>

    <!-- Home Screen App Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
    <link rel="apple-touch-icon" href="/static/icon-192.png">

    <!-- Make it Open as a Fullscreen Standalone App -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#667eea">
</head>
<body>

    <div class="container">
        <h1>Voice AI</h1>
        
        <div id="status" class="status-badge">Disconnected</div>

        <!-- Animated Equalizer Bars -->
        <div id="visualizer" class="visualizer idle">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn-primary">Start Voice</button>
            <button id="stopBtn" class="btn-danger" disabled>Stop</button>
        </div>

        <div class="info-text">
            <small>Tap Start and speak naturally</small>
        </div>
    </div>

</body>
</html>
