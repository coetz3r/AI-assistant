<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice AI Assistant</title>
    <style>
        /* Add these styles to your existing CSS */
        .status-container {
            text-align: center;
            padding: 20px;
            margin: 10px 0;
        }
        
        #status {
            font-size: 2em;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        #status.listening {
            color: #4CAF50;
        }
        
        #status.thinking {
            color: #FF9800;
            animation: pulse 1s ease-in-out infinite;
        }
        
        #status.talking {
            color: #2196F3;
            animation: pulse 0.5s ease-in-out infinite;
        }
        
        #status.disconnected {
            color: #f44336;
        }
        
        #status-sub {
            font-size: 1em;
            color: #666;
            margin-top: 5px;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        .status-indicator.listening {
            background-color: #4CAF50;
            animation: blink 1s ease-in-out infinite;
        }
        
        .status-indicator.thinking {
            background-color: #FF9800;
            animation: spin 1s linear infinite;
        }
        
        .status-indicator.talking {
            background-color: #2196F3;
            animation: pulse 0.5s ease-in-out infinite;
        }
        
        .status-indicator.disconnected {
            background-color: #f44336;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Visualizer bars - keep your existing styles */
        .visualizer-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 120px;
            gap: 4px;
            padding: 20px;
        }
        
        .bar {
            width: 8px;
            height: 8px;
            background: linear-gradient(to top, #4CAF50, #2196F3);
            border-radius: 4px;
            transition: height 0.1s ease;
        }
        
        .bar.idle {
            height: 8px !important;
            opacity: 0.3;
        }
        
        /* Controls */
        .controls {
            text-align: center;
            padding: 20px;
        }
        
        .controls button {
            padding: 15px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.3s ease;
        }
        
        #startBtn {
            background-color: #4CAF50;
            color: white;
        }
        
        #startBtn:hover:not(:disabled) {
            background-color: #45a049;
            transform: scale(1.05);
        }
        
        #stopBtn {
            background-color: #f44336;
            color: white;
        }
        
        #stopBtn:hover:not(:disabled) {
            background-color: #da190b;
            transform: scale(1.05);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        /* Status animation for visualizer */
        .visualizer-container.interrupt {
            animation: flash 0.3s ease;
        }
        
        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="status-container">
        <div id="status">
            <span class="status-indicator disconnected" id="statusIndicator"></span>
            Disconnected
        </div>
        <div id="status-sub">Tap Start to begin</div>
    </div>

    <div class="visualizer-container" id="visualizer">
        <div class="bar idle"></div>
        <div class="bar idle"></div>
        <div class="bar idle"></div>
        <div class="bar idle"></div>
        <div class="bar idle"></div>
        <div class="bar idle"></div>
        <div class="bar idle"></div>
        <div class="bar idle"></div>
        <div class="bar idle"></div>
        <div class="bar idle"></div>
        <div class="bar idle"></div>
        <div class="bar idle"></div>
        <div class="bar idle"></div>
        <div class="bar idle"></div>
        <div class="bar idle"></div>
        <div class="bar idle"></div>
    </div>

    <div class="controls">
        <button id="startBtn">Start</button>
        <button id="stopBtn" disabled>Stop</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
