<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice AI Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>
</head>
<body>

    <div id="status" class="status-badge">Disconnected</div>

    <!-- Animated Equalizer Bars -->
    <div id="visualizer" class="visualizer idle">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <div class="controls">
        <button id="startBtn">Start Voice</button>
        <button id="stopBtn" disabled>Stop</button>
    </div>

</body>
</html>
