<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice AI Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 2rem;
        }

        .status-badge {
            font-size: 0.875rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
        }

        .status-badge.connected {
            color: #38bdf8;
            border-color: #0284c7;
        }

        /* Equalizer Bar Container */
        .visualizer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 120px;
            width: 100%;
            max-width: 300px;
        }

        .bar {
            width: 12px;
            height: 16px;
            background-color: #38bdf8;
            border-radius: 6px;
            transition: height 0.05s ease, background-color 0.2s ease;
        }

        /* Inactive visualizer state */
        .visualizer.idle .bar {
            height: 8px !important;
            background-color: #334155;
        }

        .controls {
            display: flex;
            gap: 1rem;
        }

        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 0.75rem 1.75rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0369a1;
        }

        button:disabled {
            background-color: #334155;
            cursor: not-allowed;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div id="status" class="status-badge">Disconnected</div>

    <!-- Animated Equalizer Bars -->
    <div id="visualizer" class="visualizer idle">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <div class="controls">
        <button id="startBtn">Start Voice</button>
        <button id="stopBtn" disabled>Stop</button>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const visualizer = document.getElementById('visualizer');
        const bars = document.querySelectorAll('.bar');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');

        let ws = null;
        let audioCtx = null;
        let micStream = null;
        let audioProcessor = null;

        // Sound Output Synthesis Visualizer setup
        let playbackAnalyser = null;

        startBtn.addEventListener('click', async () => {
            try {
                // Initialize Audio Context
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                
                // Get Microphone Access
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                // Establish WSS Connection
                const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(`${protocol}//${location.host}/ws`);
                ws.binaryType = 'arraybuffer';

                ws.onopen = () => {
                    statusEl.textContent = 'Listening / Connected';
                    statusEl.classList.add('connected');
                    startBtn.disabled = true;
                    stopBtn.disabled = false;

                    setupMicStreaming();
                };

                ws.onmessage = async (event) => {
                    if (event.data instanceof ArrayBuffer) {
                        // Received TTS Audio Chunk from Python
                        playIncomingAudio(event.data);
                    }
                };

                ws.onclose = () => {
                    stopSession();
                };

            } catch (err) {
                console.error('Error starting voice stream:', err);
                alert('Microphone access or WebSocket connection failed.');
            }
        });

        stopBtn.addEventListener('click', () => {
            stopSession();
        });

        function setupMicStreaming() {
            const source = audioCtx.createMediaStreamSource(micStream);
            // ScriptProcessor to capture raw PCM frames
            audioProcessor = audioCtx.createScriptProcessor(4096, 1, 1);

            audioProcessor.onaudioprocess = (e) => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    const inputData = e.inputBuffer.getChannelData(0);
                    // Convert Float32 to Int16 PCM array buffer
                    const pcm16 = new Int16Array(inputData.length);
                    for (let i = 0; i < inputData.length; i++) {
                        pcm16[i] = Math.max(-1, Math.min(1, inputData[i])) * 0x7FFF;
                    }
                    ws.send(pcm16.buffer);
                }
            };

            source.connect(audioProcessor);
            audioProcessor.connect(audioCtx.destination);
        }

        function playIncomingAudio(arrayBuffer) {
            visualizer.classList.remove('idle');

            // Set up audio analyzer for vertical bar animation
            if (!playbackAnalyser) {
                playbackAnalyser = audioCtx.createAnalyser();
                playbackAnalyser.fftSize = 32;
                playbackAnalyser.connect(audioCtx.destination);
                animateVisualizer();
            }

            // Decode binary audio chunk and play
            audioCtx.decodeAudioData(arrayBuffer, (buffer) => {
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(playbackAnalyser);
                source.start();

                source.onended = () => {
                    visualizer.classList.add('idle');
                };
            });
        }

        function animateVisualizer() {
            if (!playbackAnalyser) return;
            const dataArray = new Uint8Array(playbackAnalyser.frequencyBinCount);

            function draw() {
                requestAnimationFrame(draw);
                playbackAnalyser.getByteFrequencyData(dataArray);

                bars.forEach((bar, index) => {
                    const value = dataArray[index] || 0;
                    // Scale height between 10px and 110px based on audio output amplitude
                    const barHeight = Math.max(8, (value / 255) * 110);
                    bar.style.height = `${barHeight}px`;
                });
            }
            draw();
        }

        function stopSession() {
            if (ws) ws.close();
            if (micStream) micStream.getTracks().forEach(track => track.stop());
            if (audioCtx) audioCtx.close();

            visualizer.classList.add('idle');
            statusEl.textContent = 'Disconnected';
            statusEl.classList.remove('connected');
            startBtn.disabled = false;
            stopBtn.disabled = true;
        }
    </script>
</body>
</html>
